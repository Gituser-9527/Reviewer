services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_compliance_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test_user -d job_compliance_test']
      interval: 2s
      timeout: 2s
      retries: 30
