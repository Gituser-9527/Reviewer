<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>岗位审核捕获</title></head><body><main><header><p>ASSIST MODE</p><h1>岗位审核捕获</h1><span id="status" role="status">准备就绪</span></header><section id="config"><details><summary>开发连接配置</summary><label>API 地址<input id="apiBaseUrl" placeholder="http://localhost:3001"></label><label>租户<input id="tenantId"></label><label>访问令牌<input id="accessToken" type="password" autocomplete="off"></label></details></section><section class="actions"><button id="extract" type="button">提取当前岗位</button><button id="submit" type="button" disabled>提交审核</button></section><section id="preview" hidden><h2>人工预览与修正</h2><label>岗位名称<input data-field="title"></label><label>公司名称<input data-field="companyName"></label><label>地点<input data-field="location"></label><label>薪资<input data-field="salary"></label><label>用工类型<input data-field="employmentType"></label><label>岗位描述<textarea data-field="description" maxlength="50000"></textarea></label><label>任职要求（每行一项）<textarea data-field="requirements" maxlength="20000"></textarea></label><p id="warnings"></p></section><section id="result" hidden><h2>审核结果</h2><div id="decision"></div><p id="summary"></p><p id="auditId"></p><ul id="findings"></ul></section></main><script type="module" src="dist/popup.js"></script></body></html>
