services:
  postgres-alpha-local:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_compliance_alpha
      POSTGRES_USER: alpha_local
      POSTGRES_PASSWORD: ${INTERNAL_ALPHA_POSTGRES_PASSWORD:?Run npm run alpha:local:setup first.}
    ports:
      - "127.0.0.1:${INTERNAL_ALPHA_POSTGRES_PORT:?Run npm run alpha:local:setup first.}:5432"
    volumes:
      - alpha-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alpha_local -d job_compliance_alpha']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  alpha-local-postgres-data:
